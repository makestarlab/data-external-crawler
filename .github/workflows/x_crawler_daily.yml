name: X Crawler Daily

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      curation_model:
        description: '큐레이션 모델 override (비워두면 기본값=Sonnet 5). 예: gpt-5.6-terra'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 원래 20분이었는데, 백필 이후 밀린 큐레이션 백로그(계정당 여러 번 Claude 호출)가 있으면
    # 20분으로는 부족해서 "Error: The operation was canceled." 로 중간에 잘리는 문제가 있었다
    # (2026-07-30). 큐레이션은 계정 단위로 처리 완료된 만큼만 is_curated=TRUE로 남기고 재시작
    # 가능하지만, 애초에 여유 있게 잡아서 한 번에 끝나도록 90분으로 늘림.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python x_crawler.py

      - name: Curate events (raw -> x_event_announcements)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # 기본은 Claude Sonnet 5 (curate_events.py 기본값과 동일). Haiku 4.5 대비 실제 데이터로
          # 비교 테스트한 결과 관련성 판단/추출 정확도가 유의미하게 나아서 기본값으로 승격함
          # (2026-07-30, README 참고). 다시 haiku로 비교하고 싶으면 Actions 탭 > "Run workflow" >
          # curation_model 입력창에 'claude-haiku-4-5-20251001'을 넣으면 된다.
          CURATION_MODEL: ${{ github.event.inputs.curation_model || 'claude-sonnet-5' }}
        run: python curate_events.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: run_summary_*.csv
          if-no-files-found: ignore
