name: X Crawler Daily

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      curation_model:
        description: '큐레이션 모델 override (비워두면 기본값=Haiku 4.5). 예: claude-sonnet-5'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python x_crawler.py

      - name: Curate events (raw -> x_event_announcements)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # 기본은 Claude Haiku 4.5 (claude-haiku-4-5-20251001, curate_events.py 기본값과 동일).
          # ax팀 피드백: 요약/가공 품질이 부족하면 상위 모델로 바꿔보라는 의견 -> 코드 수정 없이
          # Actions 탭 > "Run workflow" > curation_model 입력창에 'claude-sonnet-5' 등을 넣어
          # 바로 비교 테스트할 수 있다.
          CURATION_MODEL: ${{ github.event.inputs.curation_model || 'claude-haiku-4-5-20251001' }}
        run: python curate_events.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: run_summary_*.csv
          if-no-files-found: ignore
