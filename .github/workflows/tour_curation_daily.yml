name: Tour Curation Daily

# x_crawler_daily.yml 에 스텝으로 붙이지 않고 워크플로를 분리한 이유
#   기존 워크플로는 크롤링 -> 판매 이벤트 큐레이션이 한 잡에 묶여 있어서, 투어 큐레이션이
#   실패하면 그 잡 전체가 빨갛게 뜬다. 투어 쪽은 아직 프롬프트를 다듬는 단계라 실패가
#   잦을 수 있고, 그것 때문에 매일 도는 수집 파이프라인의 상태 표시가 흐려지면 안 된다.
#   수집이 끝난 뒤 도는 별도 워크플로로 두고, 안정화되면 그때 합치면 된다.

on:
  schedule:
    # 매일 21:40 UTC = 06:40 KST. x_crawler_daily(21:00 UTC 시작)가 끝난 뒤에 돌도록 40분 뒤로 뺐다.
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '조회할 과거 일수 (기본 14). 최초 백필은 90 정도로 넣으면 된다'
        required: false
        default: ''
      model:
        description: '추출 모델 override (비워두면 claude-sonnet-5)'
        required: false
        default: ''
      skip_slack:
        description: 'true 로 넣으면 Slack 발송을 건너뛴다 (백필 시 채널 도배 방지)'
        required: false
        default: ''

jobs:
  curate-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # [2026-09-01] 테스트 스텝을 여기 둔 이유
      #   프롬프트에 트윗 본문이 안 들어가는 버그(변수 섀도잉)가 두 번 연속 운영에 나갔다.
      #   두 번 다 회귀 테스트는 이미 있었지만 워크플로가 그걸 안 돌려서 못 잡았고,
      #   대신 Claude 호출 수십~수백 건을 쓰고 0행을 적재했다.
      #   1초짜리 스텝으로 그걸 막는다. 깨지면 API 를 아예 안 부른다.
      - name: Run regression tests (fail fast before spending tokens)
        run: |
          python test_curate_tour.py
          python test_notify_slack.py

      - name: Curate tour announcements (raw -> x_tour_announcements)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TOUR_CURATION_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-5' }}
          TOUR_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
        run: python curate_tour.py

      - name: Notify Slack (x_tour_announcements -> #test-delphi)
        # 백필처럼 대량 처리한 직후에는 skip_slack=true 로 채널 도배를 막는다.
        # 그래도 발송 이력이 안 남으므로 다음 정기 실행에서 최근 3일치가 다시 대상이 된다.
        if: ${{ github.event.inputs.skip_slack != 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_LABEL: '#test-delphi'
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python notify_tour_slack.py
